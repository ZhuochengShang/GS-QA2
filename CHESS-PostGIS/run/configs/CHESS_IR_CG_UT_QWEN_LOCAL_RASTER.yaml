setting_name: CHESS_IR_CG_UT_QWEN_LOCAL_RASTER

team_agents:
  information_retriever:
    engine: 'local-openai-compatible'
    tools:
      extract_keywords:
        template_name: 'extract_keywords'
        engine_config:
          engine_name: 'local-openai-compatible'
          temperature: 0.2
        parser_name: 'python_list_output_parser'
      retrieve_entity: {}
      retrieve_context:
        top_k: 5

  candidate_generator:
    engine: 'local-openai-compatible'
    tools:
      generate_candidate:
        generator_configs:
          - template_name: 'generate_candidate_one_postgis'
            engine_config:
              engine_name: 'local-openai-compatible'
              temperature: 0.3
            parser_name: 'generate_candidate_gemini_markdown_cot'
            sampling_count: 1
          - template_name: 'generate_candidate_two_postgis'
            engine_config:
              engine_name: 'local-openai-compatible'
              temperature: 0.3
            parser_name: 'generate_candidate_gemini_markdown_cot'
            sampling_count: 1

      revise:
        template_name: 'revise_one_postgis'
        engine_config:
          engine_name: 'local-openai-compatible'
          temperature: 0.0
        parser_name: 'revise_new'

  unit_tester:
    engine: 'local-openai-compatible'
    tools:
      generate_unit_test:
        template_name: 'generate_unit_tests'
        engine_config:
          engine_name: 'local-openai-compatible'
          temperature: 0.3
        parser_name: 'generate_unit_tests'
        unit_test_count: 3
        sampling_count: 1

      evaluate:
        template_name: 'evaluate'
        engine_config:
          engine_name: 'local-openai-compatible'
          temperature: 0.0
        parser_name: 'evaluate'
